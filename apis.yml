name: LinkAGI Model API
description: >-
  LinkAGI is a Chinese third-party AI API relay (中转站) that fronts a pool of upstream model accounts behind a
  single host, api.linktoagi.com, and re-exposes them on three imitated vendor protocols: OpenAI-compatible
  Chat Completions and Responses, an Anthropic Messages-shaped route, and a Gemini generateContent-shaped
  route. It is sold to developers running Codex, Claude Code, Gemini CLI and desktop chat clients who want a
  CNY, prepaid, pay-as-you-go base-URL swap instead of a foreign card and a vendor account. A token belongs
  to a group (号池) that decides which models it can address and at what billing ratio; the live model and
  price table is published unauthenticated at /api/pricing. The service runs the open-source New API gateway
  and publishes a first-party OpenAPI 3.1, APIs.json, llms.txt and Postman collection, plus an unusually
  candid evidence boundary that marks its Anthropic and Gemini compatibility as advertised but unverified.
